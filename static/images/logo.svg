<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Hexagon / Shield -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#logoGrad)" />
    <!-- Chart Bars in Logo -->
    <rect x="10" y="24" width="5" height="12" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="19" y="16" width="5" height="20" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="28" y="10" width="5" height="26" rx="2" fill="#FFFFFF" />
    <!-- Growth Line -->
    <path d="M12 22 L21 14 L30 8" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="64" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0F172A" letter-spacing="-0.4">
    ENTERPRISE
  </text>
  <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563EB" letter-spacing="1.2">
    SALES INTELLIGENCE
  </text>
</svg>
